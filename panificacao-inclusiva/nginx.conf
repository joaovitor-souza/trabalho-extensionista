server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Compressão Gzip
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/rss+xml application/atom+xml image/svg+xml;

    # Cabeçalhos de segurança básicos
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Cache longo para assets estáticos com hash no nome
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Cache moderado para imagens de marca
    location /brand/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # Imagens de produto locais (R2 usa immutable; isto padroniza dev/staging e
    # eventuais fallbacks servidos direto pelo container).
    location /produtos/ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000";
    }

    # SPA routing: qualquer rota física não encontrada cai no index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
